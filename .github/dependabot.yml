# Dependency updates, opened as pull requests and checked by the same CI as any
# other change. Weekly security scanning already runs in workflows/security.yml
# (govulncheck + gitleaks); this keeps the inputs it scans current.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Dependabot re-vendors vendor/ in the same pull request.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
